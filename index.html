<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Series Mayhem — MLBB World Championship Draft</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #0c1938;
      --bg-card: #122654;
      --bg-panel: #17316b;
      --gold: #f5c451;
      --gold-bright: #fff3c4;
      --gold-dim: #b47b22;
      --blue-hex: #22d3ee;
      --blue-border: #38bdf8;
      --red-enemy: #fb7185;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #0b1736;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.36) 0%, rgba(29, 78, 216, 0.28) 38%, rgba(10, 21, 51, 0.96) 82%),
        linear-gradient(135deg, #0d1f47 0%, #152e69 50%, #0b1838 100%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
    }

    .font-display {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.06em;
    }

    /* MLBB Celestial Lobby Main Frame */
    .hex-frame {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(180deg, rgba(21, 45, 98, 0.95) 0%, rgba(12, 26, 61, 0.98) 100%);
      border: 1.5px solid rgba(245, 196, 81, 0.65);
      border-radius: 16px;
      box-shadow: 0 22px 55px rgba(4, 10, 28, 0.78), inset 0 0 0 1px rgba(125, 211, 252, 0.25);
      overflow: hidden;
      position: relative;
    }

    /* MLBB Top Lobby Header */
    .hex-header {
      background:
        linear-gradient(180deg, rgba(30, 64, 138, 0.94) 0%, rgba(17, 37, 84, 0.98) 100%),
        repeating-linear-gradient(90deg, rgba(245, 196, 81, 0.08) 0px, rgba(245, 196, 81, 0.08) 1px, transparent 1px, transparent 24px);
      border-bottom: 1.5px solid rgba(245, 196, 81, 0.55);
      padding: 14px 16px 12px;
      text-align: center;
      position: relative;
    }

    /* MLBB Gold & Royal Blue Cards */
    .corner-card {
      position: relative;
      background: linear-gradient(180deg, rgba(27, 57, 122, 0.92) 0%, rgba(15, 34, 77, 0.96) 100%);
      border: 1px solid rgba(245, 196, 81, 0.55);
      border-radius: 8px;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .corner-card:hover {
      border-color: #fff3c4;
      box-shadow: 0 0 20px rgba(245, 196, 81, 0.35);
      transform: translateY(-2px);
    }

    .corner-card:active {
      transform: scale(0.985);
    }

    .corner-tl, .corner-tr, .corner-bl, .corner-br {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--gold);
      pointer-events: none;
    }
    .corner-tl { top: 4px; left: 4px; border-top: 2px solid; border-left: 2px solid; }
    .corner-tr { top: 4px; right: 4px; border-top: 2px solid; border-right: 2px solid; }
    .corner-bl { bottom: 4px; left: 4px; border-bottom: 2px solid; border-left: 2px solid; }
    .corner-br { bottom: 4px; right: 4px; border-bottom: 2px solid; border-right: 2px solid; }

    /* MLBB Radiant Gold "Mulai Game / Classic" Action Button */
    .btn-spin {
      background: linear-gradient(180deg, #fef08a 0%, #f5c451 48%, #d99126 100%);
      border: 1.5px solid #fffbeb;
      box-shadow: 0 4px 20px rgba(245, 196, 81, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.85);
      color: #271704;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      letter-spacing: 0.16em;
      transition: all 0.18s ease;
    }
    .btn-spin:hover:not(:disabled) {
      background: linear-gradient(180deg, #fef9c3 0%, #fcd34d 50%, #e5a030 100%);
      box-shadow: 0 6px 26px rgba(253, 224, 71, 0.65), inset 0 1px 3px rgba(255, 255, 255, 0.95);
      color: #1c1002;
    }

    .btn-reroll {
      background: linear-gradient(180deg, #1d4ed8 0%, #1e3a8a 100%);
      border: 1px solid #7dd3fc;
      color: #f0f9ff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.45);
      transition: all 0.18s ease;
    }
    .btn-reroll:hover:not(:disabled) {
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      border-color: #fde047;
    }
    .btn-reroll:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Event Banners */
    .event-banner-win {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.34) 0%, rgba(14, 46, 56, 0.94) 24%, rgba(13, 33, 58, 0.96) 100%);
      border: 1px solid rgba(52, 211, 153, 0.75);
      border-left: 4px solid #34d399;
      color: #ecfdf5;
      animation: slideInEvent 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .event-banner-loss {
      background: linear-gradient(90deg, rgba(244, 63, 94, 0.34) 0%, rgba(56, 20, 42, 0.94) 24%, rgba(36, 17, 44, 0.96) 100%);
      border: 1px solid rgba(251, 113, 133, 0.75);
      border-left: 4px solid #fb7185;
      color: #fff1f2;
      animation: slideInEvent 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideInEvent {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulseSlot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.65); }
      50% { box-shadow: 0 0 0 6px rgba(34, 211, 238, 0); }
    }

    .slot-pulse {
      animation: pulseSlot 1.8s infinite;
    }

    @keyframes spinReel {
      0% { transform: translateY(-6px); opacity: 0.5; }
      50% { transform: translateY(4px); opacity: 0.85; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .reel-flash {
      animation: spinReel 0.14s ease-in-out infinite;
    }

    @keyframes hexSlotGlow {
      0%, 100% {
        border-color: rgba(56, 189, 248, 0.85);
        box-shadow: 0 0 18px rgba(56, 189, 248, 0.4), inset 0 0 12px rgba(56, 189, 248, 0.2);
      }
      50% {
        border-color: rgba(250, 204, 21, 0.95);
        box-shadow: 0 0 24px rgba(250, 204, 21, 0.55), inset 0 0 16px rgba(250, 204, 21, 0.25);
      }
    }

    .slot-spinning {
      animation: hexSlotGlow 0.28s ease-in-out infinite;
    }

    .map-token-actor {
      transition: left 0.85s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.85s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes tokenDramaticBounce {
      0% { transform: translate(-50%, -50%) scale(1); }
      25% { transform: translate(-50%, -68%) scale(1.28); }
      50% { transform: translate(-50%, -44%) scale(1.12); }
      75% { transform: translate(-50%, -58%) scale(1.24); }
      100% { transform: translate(-50%, -50%) scale(1.18); }
    }

    @keyframes actionRingPulse {
      0% { box-shadow: 0 0 0 0 rgba(253, 224, 71, 0.95); }
      70% { box-shadow: 0 0 0 14px rgba(253, 224, 71, 0); }
      100% { box-shadow: 0 0 0 0 rgba(253, 224, 71, 0); }
    }

    .token-event-active {
      z-index: 30 !important;
      animation: tokenDramaticBounce 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .token-event-active .avatar-ring {
      border-color: #fde047 !important;
      animation: actionRingPulse 0.95s infinite;
    }

    @keyframes mapCameraShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-5px, -3px) rotate(-0.7deg); }
      30% { transform: translate(5px, 3px) rotate(0.7deg); }
      45% { transform: translate(-4px, 2px) rotate(-0.5deg); }
      60% { transform: translate(4px, -2px) rotate(0.5deg); }
      75% { transform: translate(-2px, 1px) rotate(-0.2deg); }
    }

    .map-shake-heavy {
      animation: mapCameraShake 0.52s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes clashShockwave {
      0% {
        transform: translate(-50%, -50%) scale(0.35);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.6);
        opacity: 0;
      }
    }

    .clash-ring-win {
      border: 3px solid #34d399;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.45) 0%, transparent 70%);
      animation: clashShockwave 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .clash-ring-loss {
      border: 3px solid #fb7185;
      background: radial-gradient(circle, rgba(251, 113, 133, 0.45) 0%, transparent 70%);
      animation: clashShockwave 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatingCalloutPop {
      0% { opacity: 0; transform: translate(-50%, -20%) scale(0.5); }
      20% { opacity: 1; transform: translate(-50%, -75%) scale(1.12); }
      35% { transform: translate(-50%, -62%) scale(1); }
      85% { opacity: 1; transform: translate(-50%, -70%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -95%) scale(0.95); }
    }

    .map-callout-badge {
      animation: floatingCalloutPop 2.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .btn-next-match {
      background: linear-gradient(180deg, #fef08a 0%, #f5c451 50%, #d99126 100%);
      border: 1.5px solid #fffbeb;
      color: #271704;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 22px rgba(245, 196, 81, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.85);
      letter-spacing: 0.16em;
      transition: all 0.18s ease;
    }

    .btn-next-match:hover {
      background: linear-gradient(180deg, #fef9c3 0%, #fcd34d 50%, #e5a030 100%);
      box-shadow: 0 6px 28px rgba(253, 224, 71, 0.7), inset 0 1px 3px rgba(255, 255, 255, 0.95);
      transform: translateY(-1px);
    }

    .btn-next-match:active {
      transform: scale(0.985);
    }

    /* Custom Scrollbar for Modals */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0c1938; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Main Game Frame -->
  <div class="hex-frame" id="appFrame">
    <!-- Dynamic Top Header -->
    <div class="hex-header">
      <div class="flex items-center justify-between mb-1">
        <button onclick="openRosterModal()" class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded border border-[#f5c451]/60 bg-[#173370] text-[#fef08a] hover:border-white transition">
          Cards & Stats
        </button>
        <span id="headerSub" class="text-[11px] font-extrabold tracking-[0.22em] text-[#7dd3fc] uppercase">
          ROUND 1 / 5
        </span>
        <button onclick="resetGame()" class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded border border-sky-400/35 bg-[#122759] text-sky-200 hover:text-white transition">
          Reset
        </button>
      </div>
      <h1 id="headerTitle" class="font-display text-xl sm:text-2xl font-bold text-[#fffbeb] tracking-wider uppercase drop-shadow">

        <!-- HTML Overlay Layer for Role Slots & Player Tokens -->

      </div>

      <!-- Bottom Quick Synergy / Team Power Bar -->
      <div id="synergyBar" class="mt-2.5 flex items-center justify-between text-xs bg-[#10224d] border border-[#38bdf8]/40 rounded-lg px-3 py-2">

  </div>

  <!-- Player Cards & Stats Modal -->
  <div id="rosterModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="hex-frame !max-w-lg max-h-[88vh] flex flex-col">
      <div class="hex-header flex items-center justify-between">
        <span class="text-xs font-bold tracking-widest text-[#fef08a] uppercase">M-Series Player Cards</span>
        <button onclick="closeRosterModal()" class="text-xs px-2.5 py-1 rounded bg-[#173370] text-sky-100 hover:text-white border border-sky-400/50">
          Close ✕

    // =========================================================================

    // =========================================================================
    const BRACKET_NODES = {
      GROUP: { label: "GROUP STAGE", bestOf: 1, winsNeeded: 1, nextWin: "UQ", nextLoss: "LQ1" },
      UQ:    { label: "UPPER QUARTERFINALS", bestOf: 3, winsNeeded: 2, nextWin: "US", nextLoss: "LQ1" },
      US:    { label: "UPPER SEMIFINALS", bestOf: 3, winsNeeded: 2, nextWin: "UF", nextLoss: "LQ2" },

      LQ2:   { label: "LOWER QUARTERFINALS", bestOf: 3, winsNeeded: 2, nextWin: "LS", nextLoss: "ELIMINATED" },
      LS:    { label: "LOWER SEMIFINALS", bestOf: 3, winsNeeded: 2, nextWin: "LF", nextLoss: "ELIMINATED" },

    let activeTimers = [];

    function clearAllTimers() {
      activeTimers.forEach(id => {
        clearTimeout(id);
        clearInterval(id);
      });
      activeTimers = [];
    }

    function getPlayerVersionKey(teamId, playerName) {
      return `${teamId}::${playerName}`;
    }

    function createInitialState() {
      return {
        phase: "SPIN", // SPIN | SPINNING_TEAMS | PICK_TEAM | PICK_PLAYER | READY | STAGE_VS | KNOCKOUT | CHAMPION | ELIMINATED
        round: 1,
        rerolls: 3,
        roster: { EXP: null, JGL: null, MID: null, GOLD: null, ROAM: null },
        usedPlayerVersions: [],
        offeredTeams: [],
        spinSlots: [M_SERIES_TEAMS[0], M_SERIES_TEAMS[1], M_SERIES_TEAMS[2]],
        spinLocked: [false, false, false],
        selectedTeam: null,
        bracketNode: "GROUP",
        vsStageMode: "GROUP",
        opponentRoster: {},
        oppSpinningRoles: { EXP: false, JGL: false, MID: false, GOLD: false, ROAM: false },
        oppLockedRoles: { EXP: false, JGL: false, MID: false, GOLD: false, ROAM: false },
        groupMatchInProgress: false,
        groupMatchResolved: false,
        groupMatchWon: false,

        liveRedPos: JSON.parse(JSON.stringify(MAP_POSITIONS.red)),
        activeBlueRoles: [],
        activeRedRoles: [],
        mapEffect: null,

          bestOf: 3,
          winsNeeded: 2,

          enemyWins: 0,

          events: [],
          gameInProgress: false,
          waitingNextMatch: false,
          lastGameWon: null,
          seriesClinched: false
        },
        tournamentHistory: [],
        bracketRivals: [],
        recapOpen: false,
        expandedStages: {},
        expandedGames: {},
        copyToast: ""
      };
    }

    let state = createInitialState();

    function resetLiveMapPositions() {
      state.liveBluePos = JSON.parse(JSON.stringify(MAP_POSITIONS.blue));
      state.liveRedPos = JSON.parse(JSON.stringify(MAP_POSITIONS.red));
      state.activeBlueRoles = [];
      state.activeRedRoles = [];
      state.mapEffect = null;
    }

    function resetGame() {
      clearAllTimers();
      state = createInitialState();
      render();
    }

    function getEligibleTeamsForDraft() {
      return M_SERIES_TEAMS.filter(team =>
        team.players.some(p => !state.roster[p.pos])
      );
    }

    function drawThreeRandomTeams(excludeIds = []) {
      let pool = getEligibleTeamsForDraft().filter(t => !excludeIds.includes(t.id));
      if (pool.length < 3) {
        pool = getEligibleTeamsForDraft();
      }
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 3);
    }

    function runTeamSpinAnimation(isReroll = false) {
      if (isReroll) {
        if (state.rerolls <= 0) return;
        state.rerolls--;
      }
      clearAllTimers();

      const prevIds = isReroll ? state.offeredTeams.map(t => t.id) : [];
      const finalTeams = drawThreeRandomTeams(prevIds);
      state.offeredTeams = finalTeams;
      state.spinLocked = [false, false, false];
      state.phase = "SPINNING_TEAMS";
      render();

      const allEligible = getEligibleTeamsForDraft();
      const cycleInterval = setInterval(() => {
        for (let i = 0; i < 3; i++) {
          if (!state.spinLocked[i]) {
            state.spinSlots[i] = allEligible[Math.floor(Math.random() * allEligible.length)];
          }
        }
        render();
      }, 75);
      activeTimers.push(cycleInterval);

      // Staggered lock-in deceleration for Slot 1, Slot 2, and Slot 3
      [0, 1, 2].forEach(slotIdx => {
        const lockDelay = 480 + slotIdx * 320;
        const lockTimer = setTimeout(() => {
          state.spinLocked[slotIdx] = true;
          state.spinSlots[slotIdx] = finalTeams[slotIdx];
          render();

          if (slotIdx === 2) {
            clearInterval(cycleInterval);
            const finishTimer = setTimeout(() => {
              state.phase = "PICK_TEAM";
              render();
            }, 240);
            activeTimers.push(finishTimer);
          }
        }, lockDelay);
        activeTimers.push(lockTimer);
      });
    }

    function handleSpin() {
      runTeamSpinAnimation(false);
    }

    function handleReroll() {
      runTeamSpinAnimation(true);
    }

    function handleSelectTeam(teamId) {
      const team = M_SERIES_TEAMS.find(t => t.id === teamId);
      if (!team) return;
      state.selectedTeam = team;
      state.phase = "PICK_PLAYER";
      render();
    }

    function handleSelectPlayer(playerName) {
      const team = state.selectedTeam;
      if (!team) return;
      const player = team.players.find(p => p.name === playerName && !state.roster[p.pos]);
      if (!player) return;

      const versionKey = getPlayerVersionKey(team.id, player.name);
      state.roster[player.pos] = { ...player, team, versionKey };
      state.usedPlayerVersions.push(versionKey);

      const draftedCount = ROLES.filter(r => state.roster[r]).length;
      if (draftedCount >= 5) {
        state.phase = "READY";
      } else {
        state.round = draftedCount + 1;
        state.selectedTeam = null;
        state.phase = "SPIN";
      }
      render();
    }

    // =========================================================================
    // 4. TEAM POWER, SYNERGY & OPPONENT POOL HELPERS
    // =========================================================================
    function calculateTeamStats(roster) {
      const drafted = ROLES.map(r => roster[r]).filter(Boolean);
      if (drafted.length === 0) {
        return { avgOvr: 0, synergyBonus: 0, totalPower: 0, synergies: [] };
      }

      const avgOvr = Math.round(drafted.reduce((sum, p) => sum + p.ovr, 0) / drafted.length);
      const synergies = [];
      let synergyBonus = 0;

      // Count same-team, same-edition, and same-region connections
      const teamCounts = {};
      const editionCounts = {};
      const regionCounts = {};

      drafted.forEach(p => {
        if (!p.team) return;
        teamCounts[p.team.id] = (teamCounts[p.team.id] || 0) + 1;
        editionCounts[p.team.edition] = (editionCounts[p.team.edition] || 0) + 1;
        regionCounts[p.team.region] = (regionCounts[p.team.region] || 0) + 1;
      });

      Object.entries(teamCounts).forEach(([teamId, count]) => {
        if (count >= 2) {
          const teamObj = M_SERIES_TEAMS.find(t => t.id === teamId);
          const bonus = count >= 4 ? 5 : count === 3 ? 3 : 2;
          synergyBonus += bonus;
          synergies.push({
            label: `${teamObj ? teamObj.short : teamId} x${count} (+${bonus})`,
            color: "bg-amber-950/90 text-amber-200 border-amber-400/60"
          });
        }
      });

      Object.entries(editionCounts).forEach(([edition, count]) => {
        if (count >= 3) {
          const bonus = count >= 5 ? 4 : 2;
          synergyBonus += bonus;
          synergies.push({
            label: `${edition} Era x${count} (+${bonus})`,
            color: "bg-sky-950/90 text-sky-200 border-sky-400/60"
          });
        }
      });

      Object.entries(regionCounts).forEach(([region, count]) => {
        if (count >= 3) {
          const bonus = count >= 5 ? 3 : 1;
          synergyBonus += bonus;
          synergies.push({
            label: `${region} Pride x${count} (+${bonus})`,
            color: "bg-emerald-950/90 text-emerald-200 border-emerald-400/60"
          });
        }
      });

      return {
        avgOvr,
        synergyBonus,
        totalPower: avgOvr + synergyBonus,
        synergies
      };
    }

    function getAvailableOpponentPool(role) {
      const userVersionKeys = new Set(
        ROLES.map(r => state.roster[r] && state.roster[r].versionKey).filter(Boolean)
      );

      let pool = [];
      M_SERIES_TEAMS.forEach(team => {
        team.players.forEach(p => {
          if (p.pos === role) {
            const versionKey = getPlayerVersionKey(team.id, p.name);
            if (!userVersionKeys.has(versionKey)) {
              pool.push({ ...p, team, versionKey });
            }
          }
        });
      });

      if (pool.length === 0) {
        M_SERIES_TEAMS.forEach(team => {
          team.players.forEach(p => {
            if (p.pos === role) {
              pool.push({ ...p, team, versionKey: getPlayerVersionKey(team.id, p.name) });
            }
          });
        });
      }

      return pool;
    }

    function generateOpponentSquad(nodeKey = "GROUP") {
      // Progressive difficulty configuration by tournament stage
      const stageDifficulty = {
        GROUP: { minOvr: 80, targetOvr: 86, statBoost: -1, chemChance: 0.15, chemCount: 2, topSlice: 14 },
        UQ:    { minOvr: 84, targetOvr: 89, statBoost: 0,  chemChance: 0.35, chemCount: 2, topSlice: 10 },
        LQ1:   { minOvr: 83, targetOvr: 88, statBoost: 0,  chemChance: 0.30, chemCount: 2, topSlice: 11 },
        LQ2:   { minOvr: 85, targetOvr: 90, statBoost: 1,  chemChance: 0.45, chemCount: 2, topSlice: 9 },
        US:    { minOvr: 87, targetOvr: 92, statBoost: 2,  chemChance: 0.65, chemCount: 3, topSlice: 7 },
        LS:    { minOvr: 87, targetOvr: 92, statBoost: 2,  chemChance: 0.65, chemCount: 3, topSlice: 7 },
        UF:    { minOvr: 89, targetOvr: 94, statBoost: 3,  chemChance: 0.80, chemCount: 3, topSlice: 5 },
        LF:    { minOvr: 89, targetOvr: 94, statBoost: 3,  chemChance: 0.80, chemCount: 3, topSlice: 5 },
        GF:    { minOvr: 91, targetOvr: 96, statBoost: 4,  chemChance: 0.95, chemCount: 4, topSlice: 4 }
      };

      const cfg = stageDifficulty[nodeKey] || stageDifficulty.UQ;
      const isLateBracket = ["US", "LS", "UF", "LF", "GF"].includes(nodeKey);

      // Check for a natural bracket rematch (e.g., team you beat earlier climbs Lower Bracket to meet you in Finals,
      // or a team that beat you earlier meets you again for a revenge rematch)
      const eligibleRivals = state.bracketRivals.filter(r => {
        if (r.rematched) return false;
        if (nodeKey === "GF") {
          // Grand Finals rematch against a strong team beaten in Upper Semis/Finals or Group/Quarterfinals
          return ["UF", "US", "UQ", "GROUP"].includes(r.metAt);
        }
        if (["LF", "LS", "LQ2"].includes(nodeKey)) {
          // Lower bracket rematch against a team encountered earlier
          return ["GROUP", "UQ", "US"].includes(r.metAt);
        }
        return false;
      });

      const rematchChance = nodeKey === "GF" ? 0.58 : (["LF", "LS"].includes(nodeKey) ? 0.38 : 0);
      if (eligibleRivals.length > 0 && Math.random() < rematchChance) {
        const chosenRival = eligibleRivals[eligibleRivals.length - 1];
        chosenRival.rematched = true;
        const upgradedRoster = {};
        ROLES.forEach(role => {
          const baseP = chosenRival.roster[role];
          const boost = Math.max(1, cfg.statBoost);
          upgradedRoster[role] = {
            ...baseP,
            ovr: Math.min(98, baseP.ovr + boost),
            mic: Math.min(99, baseP.mic + boost),
            mac: Math.min(99, baseP.mac + boost),
            kp: Math.min(95, baseP.kp + Math.ceil(boost / 2)),
            srv: Math.min(98, baseP.srv + boost)
          };
        });
        return {
          roster: upgradedRoster,
          tag: chosenRival.userWon ? `REMATCH (${chosenRival.metLabel})` : `REVENGE MATCH (${chosenRival.metLabel})`
        };
      }

      const oppRoster = {};
      const pickedVersionsThisSquad = new Set();

      // Decide if enemy activates Team/Era/Region chemistry synergy
      let anchorTeam = null;
      let anchorEdition = null;
      if (Math.random() < cfg.chemChance) {
        const strongTeams = M_SERIES_TEAMS.filter(t => {
          const avg = t.players.filter(p => !p.isSub).reduce((s, p) => s + p.ovr, 0) / 5;
          return avg >= cfg.minOvr;
        });
        const candidateTeams = strongTeams.length > 0 ? strongTeams : M_SERIES_TEAMS;
        anchorTeam = candidateTeams[Math.floor(Math.random() * candidateTeams.length)];
        anchorEdition = anchorTeam.edition;
      }

      // Shuffle roles so chemistry anchors pick random roles across the 5 positions
      const shuffledRoles = [...ROLES].sort(() => Math.random() - 0.5);
      const chemRoles = new Set(shuffledRoles.slice(0, anchorTeam ? cfg.chemCount : 0));

      ROLES.forEach(role => {
        let pool = getAvailableOpponentPool(role).filter(p => !pickedVersionsThisSquad.has(p.versionKey));

        // Prefer chemistry teammates or same-era stars if selected for this role
        if (chemRoles.has(role) && anchorTeam) {
          const sameTeam = pool.filter(p => p.team.id === anchorTeam.id);
          const sameEdition = pool.filter(p => p.team.edition === anchorEdition && p.ovr >= cfg.minOvr);
          if (sameTeam.length > 0) {
            pool = sameTeam;
          } else if (sameEdition.length > 0) {
            pool = sameEdition;
          }
        } else {
          // Filter toward higher-rated players as rounds progress
          const highRated = pool.filter(p => p.ovr >= cfg.minOvr);
          if (highRated.length >= 3) {
            pool = highRated;
          }
          pool.sort((a, b) => Math.abs(b.ovr - cfg.targetOvr) - Math.abs(a.ovr - cfg.targetOvr));
        }

        const candidateSlice = pool.slice(0, Math.min(cfg.topSlice, pool.length));
        const pick = candidateSlice[Math.floor(Math.random() * candidateSlice.length)];
        pickedVersionsThisSquad.add(pick.versionKey);
        state.usedPlayerVersions.push(pick.versionKey);

        const boost = cfg.statBoost;
        oppRoster[role] = {
          ...pick,
          ovr: Math.min(98, Math.max(80, pick.ovr + boost)),
          mic: Math.min(99, Math.max(78, pick.mic + boost)),
          mac: Math.min(99, Math.max(78, pick.mac + boost)),
          kp: Math.min(95, Math.max(65, pick.kp + (boost > 0 ? Math.ceil(boost / 2) : 0))),
          srv: Math.min(98, Math.max(78, pick.srv + boost))
        };
      });

      const oppStats = calculateTeamStats(oppRoster);
      let tag = nodeKey === "GROUP" ? "GROUP RIVAL" : "CHALLENGER";
      if (nodeKey === "GF") tag = "GRAND FINALIST";
      else if (["UF", "LF"].includes(nodeKey)) tag = "FINALIST CONTENDER";
      else if (["US", "LS"].includes(nodeKey)) tag = "SEMIFINALIST";
      else if (oppStats.synergies.length > 0 && isLateBracket) tag = "SYNERGY SQUAD";

      return { roster: oppRoster, tag };
    }

    // =========================================================================
    // 5. TOURNAMENT STAGES & 3 DECIDING EVENTS ENGINE (WITH MAP MOVEMENT)
    // =========================================================================
    function presentOpponentRandomizerScreen(nodeKey) {
      clearAllTimers();
      state.vsStageMode = nodeKey;
      state.bracketNode = nodeKey;
      state.phase = "STAGE_VS";
      state.groupMatchInProgress = false;
      state.groupMatchResolved = false;
      state.groupMatchWon = false;

      const generated = generateOpponentSquad(nodeKey);
      const targetOpponent = generated.roster;
      state.opponentTag = generated.tag;

      state.opponentRoster = {};
      ROLES.forEach(role => {
        state.oppSpinningRoles[role] = true;
        state.oppLockedRoles[role] = false;
        const pool = getAvailableOpponentPool(role);
        const randPick = pool[Math.floor(Math.random() * pool.length)];
        state.opponentRoster[role] = randPick;
      });
      render();

      const vsCycle = setInterval(() => {
        ROLES.forEach(role => {
          if (state.oppSpinningRoles[role]) {
            const pool = getAvailableOpponentPool(role);
            const randPick = pool[Math.floor(Math.random() * pool.length)];
            state.opponentRoster[role] = randPick;
          }
        });
        render();
      }, 85);
      activeTimers.push(vsCycle);

      ROLES.forEach((role, idx) => {
        const lockDelay = 420 + idx * 260;
        const t = setTimeout(() => {
          state.oppSpinningRoles[role] = false;
          state.oppLockedRoles[role] = true;
          state.opponentRoster[role] = targetOpponent[role];
          render();

          if (idx === ROLES.length - 1) {
            clearInterval(vsCycle);
            const settleTimer = setTimeout(() => {
              ROLES.forEach(r => { state.oppLockedRoles[r] = false; });
              render();
            }, 320);
            activeTimers.push(settleTimer);
          }
        }, lockDelay);
        activeTimers.push(t);
      });
    }

    function startTournament() {
      presentOpponentRandomizerScreen("GROUP");
    }

    function handleStartVsMatch() {
      if (Object.values(state.oppSpinningRoles).some(Boolean)) return;

      if (state.vsStageMode === "GROUP") {
        if (state.groupMatchInProgress || state.groupMatchResolved) return;
        state.groupMatchInProgress = true;
        render();

        const qualTimer = setTimeout(() => {
          if (state.phase !== "STAGE_VS" || state.vsStageMode !== "GROUP") return;
          const userStats = calculateTeamStats(state.roster);
          const oppStats = calculateTeamStats(state.opponentRoster);
          const winProb = 0.62 + (userStats.totalPower - oppStats.totalPower) * 0.015;
          const won = Math.random() < Math.max(0.35, Math.min(0.92, winProb));

          state.groupMatchInProgress = false;
          state.groupMatchResolved = true;
          state.groupMatchWon = won;

          state.bracketRivals.push({
            metAt: "GROUP",
            metLabel: "GROUP STAGE",
            roster: JSON.parse(JSON.stringify(state.opponentRoster)),
            userWon: won,
            rematched: false
          });

          state.tournamentHistory.push({
            id: "GROUP",
            label: "GROUP STAGE",
            opponentRoster: JSON.parse(JSON.stringify(state.opponentRoster)),
            games: [
              {
                gameNum: 1,
                won,
                events: [
                  {
                    win: won,
                    text: won
                      ? `${state.roster.MID.name} & ${state.roster.JGL.name} control mid-river tempo and qualify for Upper Bracket`
                      : `${state.opponentRoster.JGL.name} steals Enhanced Lord, sending your team to Lower Bracket`
                  }
                ]
              }
            ]
          });

          render();
        }, 1750);
        activeTimers.push(qualTimer);
      } else {
        launchDoubleEliminationSeriesAfterVs();
      }
    }

    function proceedFromGroupStage() {
      const firstNode = state.groupMatchWon ? "UQ" : "LQ1";
      presentOpponentRandomizerScreen(firstNode);
    }

    function launchDoubleEliminationSeriesAfterVs() {
      clearAllTimers();
      state.phase = "KNOCKOUT";
      resetLiveMapPositions();

      const nodeConfig = BRACKET_NODES[state.bracketNode];
      const bestOf = nodeConfig.bestOf;
      const winsNeeded = nodeConfig.winsNeeded;

      if (!state.tournamentHistory.some(s => s.id === state.bracketNode)) {
        state.tournamentHistory.push({
          id: state.bracketNode,
          label: nodeConfig.label,
          opponentRoster: JSON.parse(JSON.stringify(state.opponentRoster)),
          games: []
        });
      }

      state.boSeries = {
        bestOf,
        winsNeeded,
        userWins: 0,
        enemyWins: 0,
        currentGame: 1,
        results: [],
        events: [],
        gameInProgress: true,
        waitingNextMatch: false,
        lastGameWon: null,
        seriesClinched: false
      };

      render();
      playCurrentSeriesGame();
    }

          statDiff: (u.GOLD.mic + u.MID.mic + userStats.totalPower * 0.4) - (e.GOLD.mic + e.MID.mic + oppStats.totalPower * 0.4),
          winText: `MANIAC! ${u.GOLD.name} pops off in the base siege and shatters the Crystal!`,
          lossText: `MANIAC! ${e.GOLD.name} wipes four in the base defense and shatters your Crystal!`,
          blueMoves: { EXP: { x: 75, y: 21 }, JGL: { x: 79, y: 25 }, MID: { x: 73, y: 29 }, GOLD: { x: 83, y: 29 }, ROAM: { x: 71, y: 23 } },
          redMoves:  { EXP: { x: 84, y: 16 }, JGL: { x: 86, y: 20 }, MID: { x: 82, y: 22 }, GOLD: { x: 88, y: 24 }, ROAM: { x: 80, y: 18 } },
          activeBlue: ["GOLD", "ROAM"],
          activeRed: ["GOLD", "ROAM"]
        },
        {
          weight: 7,
          isCrystalFinale: true,
          callout: "SAVAGE!",
          shake: true,
          focusPos: { x: 84, y: 20 },
          statDiff: (u.GOLD.mic + u.JGL.mic + userStats.totalPower * 0.4) - (e.GOLD.mic + e.JGL.mic + oppStats.totalPower * 0.4),
          winText: `LEGENDARY SAVAGE! ${u.GOLD.name} claims all 5 kills and destroys the Crystal!`,
          lossText: `LEGENDARY SAVAGE! ${e.GOLD.name} wipes all 5 members and destroys your Crystal!`,
          blueMoves: { EXP: { x: 76, y: 20 }, JGL: { x: 80, y: 24 }, MID: { x: 74, y: 28 }, GOLD: { x: 84, y: 28 }, ROAM: { x: 72, y: 22 } },
          redMoves:  { EXP: { x: 84, y: 16 }, JGL: { x: 86, y: 20 }, MID: { x: 82, y: 22 }, GOLD: { x: 88, y: 24 }, ROAM: { x: 80, y: 18 } },
          activeBlue: ["GOLD"],
          activeRed: ["GOLD"]
        }
      ];

      function pickWeightedEvent(pool) {
        const totalWeight = pool.reduce((sum, item) => sum + (item.weight || 10), 0);
        let roll = Math.random() * totalWeight;
        for (const item of pool) {
          roll -= (item.weight || 10);
          if (roll <= 0) return item;
        }
        return pool[0];
      }

      const orderedTemplates = [
        pickWeightedEvent(earlyEventPool),
        pickWeightedEvent(midEventPool),
        pickWeightedEvent(lateEventPool)
      ];

      return orderedTemplates.map(tpl => {
        const prob = 0.52 + tpl.statDiff * 0.014 + (userStats.totalPower - oppStats.totalPower) * 0.006;
        const clampedProb = Math.max(0.22, Math.min(0.84, prob));
        const isWin = Math.random() < clampedProb;
        return {
          win: isWin,
          isCrystalFinale: Boolean(tpl.isCrystalFinale),
          callout: tpl.callout || (isWin ? "ADVANTAGE!" : "AMBUSHED!"),
          shake: Boolean(tpl.shake),
          focusPos: tpl.focusPos || { x: 50, y: 50 },
          text: isWin ? tpl.winText : tpl.lossText,
          blueMoves: tpl.blueMoves,
          redMoves: tpl.redMoves,
          activeBlue: tpl.activeBlue,
          activeRed: tpl.activeRed
        };
      });
    }

    function applyEventMapMovement(ev) {
      const nextBlue = JSON.parse(JSON.stringify(MAP_POSITIONS.blue));
      const nextRed = JSON.parse(JSON.stringify(MAP_POSITIONS.red));

      // Mirror coordinates to Blue Crystal (bottom-left) if enemy wins a late-game base siege
      const invertBaseSiege = ev.isCrystalFinale && !ev.win;

      if (ev.blueMoves) {
        Object.entries(ev.blueMoves).forEach(([role, coords]) => {
          const baseX = invertBaseSiege ? (100 - coords.x) : coords.x;
          const baseY = invertBaseSiege ? (100 - coords.y) : coords.y;
          const shiftX = ev.win ? 3 : -3;
          const shiftY = ev.win ? -3 : 3;
          nextBlue[role] = {
            x: Math.min(90, Math.max(10, baseX + shiftX)),
            y: Math.min(90, Math.max(10, baseY + shiftY))
          };
        });
      }

      if (ev.redMoves) {
        Object.entries(ev.redMoves).forEach(([role, coords]) => {
          const baseX = invertBaseSiege ? (100 - coords.x) : coords.x;
          const baseY = invertBaseSiege ? (100 - coords.y) : coords.y;
          const shiftX = ev.win ? 3 : -3;
          const shiftY = ev.win ? -3 : 3;
          nextRed[role] = {
            x: Math.min(90, Math.max(10, baseX + shiftX)),
            y: Math.min(90, Math.max(10, baseY + shiftY))
          };
        });
      }

      state.liveBluePos = nextBlue;
      state.liveRedPos = nextRed;
      state.activeBlueRoles = ev.activeBlue || [];
      state.activeRedRoles = ev.activeRed || [];

      const rawFocus = ev.focusPos || { x: 50, y: 50 };
      const focusX = invertBaseSiege ? (100 - rawFocus.x) : rawFocus.x;
      const focusY = invertBaseSiege ? (100 - rawFocus.y) : rawFocus.y;

      state.mapEffect = {
        id: Date.now() + Math.random(),
        x: Math.min(84, Math.max(16, focusX)),
        y: Math.min(84, Math.max(16, focusY)),
        win: ev.win,
        callout: ev.callout,
        shake: ev.shake
      };

      if (ev.shake) {
        const arenaBox = document.getElementById("mapArenaBox");
        if (arenaBox) {
          arenaBox.classList.remove("map-shake-heavy");
          void arenaBox.offsetWidth;
          arenaBox.classList.add("map-shake-heavy");
        }
      }
    }

    function playCurrentSeriesGame() {
      if (state.phase !== "KNOCKOUT") return;
      const userStats = calculateTeamStats(state.roster);
      const oppStats = calculateTeamStats(state.opponentRoster);
      const threeEvents = buildThreeDecidingEvents(state.roster, state.opponentRoster, userStats, oppStats);

      resetLiveMapPositions();
      state.boSeries.events = [];
      state.boSeries.gameInProgress = true;
      state.boSeries.waitingNextMatch = false;
      render();

      const eventIntervalMs = 2350;
      const initialLeadMs = 1100;

      threeEvents.forEach((ev, idx) => {
        const evTimer = setTimeout(() => {
          if (state.phase !== "KNOCKOUT") return;
          state.boSeries.events.push(ev);
          applyEventMapMovement(ev);
          render();

          if (idx === 2) {
            const settleTimer = setTimeout(() => {
              if (state.phase !== "KNOCKOUT") return;
              const finaleEvent = threeEvents[2];
              const gameWon = finaleEvent.isCrystalFinale
                ? finaleEvent.win
                : threeEvents.filter(e => e.win).length >= 2;

              state.boSeries.results.push(gameWon ? "W" : "L");
              if (gameWon) state.boSeries.userWins++;
              else state.boSeries.enemyWins++;

              const stageEntry = state.tournamentHistory.find(s => s.id === state.bracketNode);
              if (stageEntry) {
                stageEntry.games.push({
                  gameNum: state.boSeries.currentGame,
                  won: gameWon,
                  events: threeEvents.map(e => ({ win: e.win, text: e.text }))
                });
              }

              state.boSeries.lastGameWon = gameWon;
              state.boSeries.gameInProgress = false;
              state.boSeries.waitingNextMatch = true;
              state.boSeries.seriesClinched =
                state.boSeries.userWins >= state.boSeries.winsNeeded ||
                state.boSeries.enemyWins >= state.boSeries.winsNeeded;

              if (state.boSeries.seriesClinched) {
                const nodeCfg = BRACKET_NODES[state.bracketNode];
                const seriesWon = state.boSeries.userWins >= state.boSeries.winsNeeded;
                state.bracketRivals.push({
                  metAt: state.bracketNode,
                  metLabel: nodeCfg.label,
                  roster: JSON.parse(JSON.stringify(state.opponentRoster)),
                  userWon: seriesWon,
                  rematched: false
                });
              }

              state.activeBlueRoles = [];
              state.activeRedRoles = [];
              state.mapEffect = null;
              render();
            }, 1750);
            activeTimers.push(settleTimer);
          }
        }, initialLeadMs + idx * eventIntervalMs);
        activeTimers.push(evTimer);
      });
    }

    function handleNextMatch() {
      if (!state.boSeries.waitingNextMatch) return;

      const nodeConfig = BRACKET_NODES[state.bracketNode];

      if (state.boSeries.userWins >= state.boSeries.winsNeeded) {
        const nextTarget = nodeConfig.nextWin;
        if (nextTarget === "CHAMPION") {
          state.phase = "CHAMPION";
          state.recapOpen = false;
          resetLiveMapPositions();
          render();
        } else {
          presentOpponentRandomizerScreen(nextTarget);
        }
        return;
      }

      if (state.boSeries.enemyWins >= state.boSeries.winsNeeded) {
        const nextTarget = nodeConfig.nextLoss;
        if (nextTarget === "ELIMINATED") {
          state.phase = "ELIMINATED";
          state.recapOpen = false;
          resetLiveMapPositions();
          render();
        } else {
          presentOpponentRandomizerScreen(nextTarget);
        }
        return;
      }

      state.boSeries.currentGame++;
      playCurrentSeriesGame();
    }

    function copyRecapSummary() {
      const isChamp = state.phase === "CHAMPION";
      const nodeLabel = BRACKET_NODES[state.bracketNode] ? BRACKET_NODES[state.bracketNode].label : "KNOCKOUT STAGE";
      const reachedLabel = isChamp ? "WORLD CHAMPIONS 🏆" : nodeLabel;
      const rosterLines = ROLES.map(r => {
        const p = state.roster[r];
        return `${r}: ${p.name} (${p.team.edition} ${p.team.name})`;
      }).join("\n");

      const stageLines = state.tournamentHistory.map(st => {
        const w = st.games.filter(g => g.won).length;
        const l = st.games.filter(g => !g.won).length;
        return `${st.label}: ${st.id === "GROUP" ? (w > 0 ? "Qualified (1st)" : "Qualified (2nd)") : `${w}-${l}`}`;
      }).join(" | ");

      const text = `M-SERIES MAYHEM — ${reachedLabel}\n${stageLines}\n\n${rosterLines}`;

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
        state.copyToast = "Recap copied to clipboard!";
      } catch (e) {
        state.copyToast = "Unable to copy summary.";
      }
      document.body.removeChild(textarea);
      render();

      const clearToast = setTimeout(() => {
        state.copyToast = "";
        render();
      }, 2200);
      activeTimers.push(clearToast);
    }

                      </div>
                      <div class="w-9 h-9 rounded overflow-hidden border ${locked ? 'border-amber-400' : 'border-rose-500/80'} shrink-0">
                        ${e ? getPlayerPortraitSvg(e, e.team) : ''}
                      </div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>

            <div class="pt-1">
              ${bottomActionHtml}
            </div>
          </div>
        `;
      } else if (state.phase === "KNOCKOUT") {
        mapWrapper.classList.remove("hidden");
        const nodeConfig = BRACKET_NODES[state.bracketNode];
        const bo = state.boSeries;

        headerSub.textContent = `BEST OF ${bo.bestOf} • GAME ${bo.currentGame}`;
        headerTitle.textContent = nodeConfig.label;

        let nextActionButtonHtml = "";
        if (bo.waitingNextMatch) {
          const isSeriesOver = bo.seriesClinched;
          let btnLabel = `NEXT MATCH (GAME ${bo.currentGame + 1}) ▸`;
          if (isSeriesOver) {
            if (bo.userWins >= bo.winsNeeded) {
              btnLabel = nodeConfig.nextWin === "CHAMPION" ? "CLAIM M-SERIES TROPHY 🏆" : "ADVANCE TO NEXT ROUND ▸";
            } else {
              btnLabel = nodeConfig.nextLoss === "ELIMINATED" ? "VIEW TOURNAMENT RECAP ▸" : "DROP TO LOWER BRACKET ▸";
            }
          }
          nextActionButtonHtml = `
            <button onclick="handleNextMatch()" class="btn-next-match w-full py-3.5 rounded-md font-display text-xs sm:text-sm font-bold uppercase cursor-pointer">
              ${btnLabel}
            </button>
          `;
        }

        stageContainer.innerHTML = `
          <div class="space-y-3">
            <!-- Series Scoreboard Header -->
            <div class="flex items-center justify-between bg-[#091533] border border-[#f5c451]/45 rounded-lg px-3 py-2">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#00d8ff]"></span>
                <span class="text-xs font-extrabold text-white">YOUR SQUAD</span>
                <span class="font-display text-base font-bold text-[#fef08a] ml-1">${bo.userWins}</span>
              </div>
              <div class="flex items-center gap-1.5">
                ${Array.from({ length: bo.bestOf }).map((_, i) => {
                  const res = bo.results[i];
                  const cls = res === "W"
                    ? "bg-emerald-400 border-emerald-200"
                    : res === "L"
                      ? "bg-rose-500 border-rose-300"
                      : "bg-slate-800 border-slate-600";
                  return `<span class="w-2.5 h-2.5 rounded-full border ${cls}"></span>`;
                }).join("")}
              </div>
              <div class="flex items-center gap-2">
                <span class="font-display text-base font-bold text-rose-400 mr-1">${bo.enemyWins}</span>
                <span class="text-xs font-extrabold text-rose-200">OPPONENT</span>
                <span class="w-2.5 h-2.5 rounded-full bg-[#ff3b4e]"></span>
              </div>
            </div>

            <!-- Live 3 Deciding Events Feed -->
            <div class="space-y-1.5 min-h-[132px] flex flex-col justify-center">
              ${bo.events.length === 0 ? `
                <div class="text-center py-6 text-xs text-sky-200/80 animate-pulse tracking-wider uppercase font-semibold">
                  Deploying onto the Land of Dawn...
                </div>
              ` : bo.events.map(ev => `
                <div class="${ev.win ? 'event-banner-win' : 'event-banner-loss'} rounded-md px-3 py-2.5 shadow">
                  <p class="text-xs font-semibold leading-snug text-center">${ev.text}</p>
                </div>
              `).join("")}
            </div>

            ${nextActionButtonHtml}
          </div>
        `;
      } else if (state.phase === "CHAMPION" || state.phase === "ELIMINATED") {
        mapWrapper.classList.remove("hidden");
        const isChamp = state.phase === "CHAMPION";
        const reachedNode = BRACKET_NODES[state.bracketNode] ? BRACKET_NODES[state.bracketNode].label : "KNOCKOUT STAGE";
        headerSub.textContent = isChamp ? "M-SERIES WORLD CHAMPIONS" : `ELIMINATED IN ${reachedNode}`;
        headerTitle.textContent = isChamp ? "🏆 VICTORY" : "DEFEAT";

        stageContainer.innerHTML = `
          <div class="space-y-3">
            <div class="corner-card p-4 text-center space-y-3">
              <span class="corner-tl"></span><span class="corner-tr"></span>
              <span class="corner-bl"></span><span class="corner-br"></span>
              <div class="font-display text-lg font-bold ${isChamp ? 'text-[#fef08a]' : 'text-rose-300'}">
                ${isChamp ? 'YOUR SQUAD LIFTED THE M-SERIES TROPHY!' : `YOUR RUN ENDED IN THE ${reachedNode}`}
              </div>
              <p class="text-xs text-sky-100 leading-relaxed">
                ${isChamp
                  ? 'An unforgettable 5-man M-Series crossover roster conquered the Land of Dawn.'
                  : 'Draft stronger cross-era synergies or higher OVR stars to claim the crown next run!'}
              </p>

              <div class="flex flex-col sm:flex-row gap-2 pt-1">
                <button onclick="toggleRecapDrawer()" class="flex-1 py-3 px-3 rounded-md border border-[#f5c451] bg-[#173370] text-[#fef08a] font-display text-xs font-bold tracking-[0.14em] uppercase hover:bg-[#1e40af] transition cursor-pointer">
                  ${state.recapOpen ? 'HIDE TOURNAMENT RECAP ▲' : 'TOURNAMENT RECAP ▼'}
                </button>
                <button onclick="resetGame()" class="btn-spin flex-1 py-3 px-3 rounded-md font-display text-xs font-bold tracking-[0.16em] uppercase cursor-pointer">
                  PLAY AGAIN
                </button>
              </div>
            </div>

            <!-- Collapsible Tournament Recap Accordion Drawer -->
            ${state.recapOpen ? renderTournamentRecapAccordion() : ""}
          </div>
        `;
      }
    }

    function renderTournamentRecapAccordion() {
      return `
        <div class="corner-card p-3 space-y-2.5 text-left">
          <div class="flex items-center justify-between border-b border-sky-400/30 pb-2">
            <span class="font-display text-xs font-bold tracking-widest text-[#fef08a] uppercase">
              Tournament Run Recap
            </span>
            <button onclick="copyRecapSummary()" class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded border border-sky-400/50 bg-[#0d1f47] text-sky-200 hover:text-white cursor-pointer">
              Copy Run
            </button>
          </div>

          ${state.copyToast ? `
            <div class="text-[11px] text-center font-semibold text-emerald-300 bg-emerald-950/80 border border-emerald-500/40 rounded py-1">
              ${state.copyToast}
            </div>
          ` : ""}

          <div class="space-y-2">
            ${state.tournamentHistory.map(stage => {
              const stageExpanded = state.expandedStages[stage.id] !== undefined ? state.expandedStages[stage.id] : true;
              const resultDots = stage.games.map(g =>
                `<span class="w-2.5 h-2.5 rounded-full inline-block ${g.won ? 'bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.75)]' : 'bg-rose-400 shadow-[0_0_6px_rgba(251,113,133,0.75)]'}"></span>`
              ).join("");

              return `
                <div class="border border-sky-400/35 rounded-lg bg-[#0b1838] overflow-hidden shadow-md">
                  <!-- Stage Header (e.g., UPPER SEMIFINALS + colored W/L dots) -->
                  <button onclick="toggleRecapStage('${stage.id}')" class="w-full px-3 py-2.5 flex items-center justify-between bg-[#10234d] hover:bg-[#152d63] transition cursor-pointer">
                    <span class="text-xs text-sky-300 w-4 text-left">${stageExpanded ? '▾' : '▸'}</span>
                    <div class="flex flex-col items-center">
                      <div class="font-display text-xs sm:text-sm font-bold tracking-[0.16em] text-[#fffbeb] uppercase">
                        ${stage.label}
                      </div>
                      <div class="flex items-center gap-1.5 mt-1.5">
                        ${resultDots}
                      </div>
                    </div>
                    <span class="w-4"></span>
                  </button>

                  ${stageExpanded ? `
                    <div class="p-2.5 border-t border-sky-400/25 space-y-2.5">
                      <!-- 5-Card Visual Opponent Lineup Grid -->
                      <div>
                        <div class="text-center text-[10px] font-extrabold tracking-[0.22em] text-rose-400 uppercase mb-1.5">
                          OPPONENT
                        </div>
                        <div class="grid grid-cols-5 gap-1">
                          ${ROLES.map(r => {
                            const opp = stage.opponentRoster[r];
                            if (!opp) return "";
                            return `
                              <div class="border border-[#f5c451]/45 rounded bg-[#09142e] overflow-hidden flex flex-col items-center text-center">
                                <div class="relative w-full aspect-square bg-[#0e1f45] border-b border-sky-400/25">
                                  ${getPlayerPortraitSvg(opp, opp.team)}
                                  <div class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-black/80 border border-[#f5c451]/60 flex items-center justify-center">
                                    ${getRoleIconSvg(r, 10)}
                                  </div>
                                </div>
                                <div class="p-1 w-full">
                                  <div class="text-[9px] font-bold text-white truncate leading-tight">${opp.name}</div>
                                  <div class="text-[8px] font-semibold text-[#fef08a] leading-tight mt-0.5">${opp.team.edition}</div>
                                  <div class="text-[7.5px] text-sky-300 truncate leading-tight">${opp.team.short}</div>
                                </div>
                              </div>
                            `;
                          }).join("")}
                        </div>
                      </div>

                      <!-- Per-Game Accordion Rows with Full-Width Event Recap Banners -->
                      <div class="space-y-1.5">
                        ${stage.games.map(g => {
                          const gameKey = `${stage.id}_G${g.gameNum}`;
                          const gameExpanded = Boolean(state.expandedGames[gameKey]);

                          return `
                            <div class="rounded-md border border-sky-400/25 bg-[#0e1f45] overflow-hidden">
                              <button onclick="toggleRecapGame('${gameKey}')" class="w-full px-3 py-2 flex items-center justify-between text-xs cursor-pointer hover:bg-[#142b5e] transition">
                                <span class="text-sky-300 text-[11px] w-4 text-left">${gameExpanded ? '▾' : '▸'}</span>
                                <span class="font-display text-xs font-bold tracking-[0.18em] text-slate-200 uppercase">
                                  GAME ${g.gameNum}
                                </span>
                                <span class="font-extrabold text-sm w-4 text-right ${g.won ? 'text-emerald-400' : 'text-rose-400'}">
                                  ${g.won ? '✓' : '✗'}
                                </span>
                              </button>

                              ${gameExpanded ? `
                                <div class="px-2 pb-2.5 pt-1 space-y-1.5 border-t border-sky-400/15 bg-[#091533]">
                                  ${g.events.map(ev => `
                                    <div class="${ev.win ? 'event-banner-win' : 'event-banner-loss'} rounded px-3 py-2 text-center shadow-sm">
                                      <p class="text-[11px] font-semibold leading-snug">
                                        ${ev.text}
                                      </p>
                                    </div>
                                  `).join("")}
                                </div>
                              ` : ""}
                            </div>
                          `;
                        }).join("")}
                      </div>
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function renderMapTokens() {
      const layer = document.getElementById("mapTokensLayer");
      let html = "";

      // Dramatic Clash Shockwave & Floating Callout Badge during active match events
      if (state.phase === "KNOCKOUT" && state.mapEffect) {
        const fx = state.mapEffect;
        html += `
          <div key="${fx.id}" style="left:${fx.x}%; top:${fx.y}%;" class="absolute z-40 pointer-events-none">
            <div class="w-16 h-16 rounded-full ${fx.win ? 'clash-ring-win' : 'clash-ring-loss'}"></div>
            <div class="map-callout-badge whitespace-nowrap px-2.5 py-0.5 rounded-full font-display text-[10px] font-extrabold tracking-widest uppercase shadow-lg border ${fx.win ? 'bg-emerald-950/95 text-emerald-200 border-emerald-400' : 'bg-rose-950/95 text-rose-200 border-rose-400'}">
              ${fx.callout}
            </div>
          </div>
        `;
      }

      // Blue Team (User) Slots & Drafted Tokens
      ROLES.forEach(role => {
        const pos = state.liveBluePos[role];
        const player = state.roster[role];
        const isActing = state.activeBlueRoles.includes(role);

        if (!player) {
          html += `
            <div style="left:${pos.x}%; top:${pos.y}%; transform:translate(-50%,-50%);"
                 class="absolute flex flex-col items-center">
              <div class="w-9 h-9 rounded-full bg-[#0b1736]/90 border-2 border-[#38bdf8] slot-pulse flex items-center justify-center shadow-lg">
                ${getRoleIconSvg(role, 16)}
              </div>
              <span class="mt-0.5 text-[9px] font-extrabold tracking-wider px-1.5 py-0.2 rounded bg-black/85 text-sky-200 border border-sky-400/40">
                ${role}
              </span>
            </div>
          `;
        } else {
          html += `
            <div style="left:${pos.x}%; top:${pos.y}%; transform:translate(-50%,-50%);"
                 class="map-token-actor absolute flex flex-col items-center z-10 ${isActing ? 'token-event-active' : ''}">
              <div class="avatar-ring w-11 h-11 rounded-full overflow-hidden border-2 border-[#00d8ff] bg-[#0b1736] shadow-[0_0_12px_rgba(0,216,255,0.65)]">
                ${getPlayerPortraitSvg(player, player.team)}
              </div>
              <span class="-mt-1 text-[9px] font-extrabold px-1.5 rounded bg-[#07132e]/95 text-[#fffbeb] border border-[#f5c451] shadow">
                ${player.name}
              </span>
            </div>
          `;
        }
      });

      // Red Team (Opponent) Tokens during Knockout Matches
      if (state.phase === "KNOCKOUT") {
        ROLES.forEach(role => {
          const pos = state.liveRedPos[role];
          const opp = state.opponentRoster[role];
          const isActing = state.activeRedRoles.includes(role);
          if (!opp) return;
          html += `
            <div style="left:${pos.x}%; top:${pos.y}%; transform:translate(-50%,-50%);"
                 class="map-token-actor absolute flex flex-col items-center z-10 ${isActing ? 'token-event-active' : ''}">
              <div class="avatar-ring w-10 h-10 rounded-full overflow-hidden border-2 border-[#ff3b4e] bg-[#2a0c13] shadow-[0_0_12px_rgba(255,59,78,0.65)]">
                ${getPlayerPortraitSvg(opp, opp.team)}
              </div>
              <span class="-mt-1 text-[8px] font-bold px-1 rounded bg-rose-950/95 text-rose-100 border border-rose-500/80">
                ${opp.name}
              </span>
            </div>
          `;
        });
      }

      layer.innerHTML = html;
    }

    // =========================================================================
    // 8. CARDS & STATS MODAL
    // =========================================================================
    function openRosterModal() {
      const modal = document.getElementById("rosterModal");
      const body = document.getElementById("rosterModalBody");

      const draftedRoles = ROLES.filter(r => state.roster[r]);
      let html = "";

      if (draftedRoles.length > 0) {
        html += `<div class="text-[11px] font-bold uppercase tracking-widest text-[#fef08a]">Your Drafted Lineup</div>`;
        draftedRoles.forEach(r => {
          const p = state.roster[r];
          html += renderPlayerCardDetail(p, p.team);
        });
      }

      html += `<div class="text-[11px] font-bold uppercase tracking-widest text-sky-300 pt-2">All M-Series Teams (M1 – M7)</div>`;
      M_SERIES_TEAMS.forEach(team => {
        html += `
          <div class="border border-sky-400/35 rounded-lg p-2.5 bg-[#0e1f45]">
            <div class="flex items-center gap-2.5 mb-2">
              ${getTeamLogoSvg(team, 34)}
              <div>
                <div class="font-display text-sm font-bold text-[#fffbeb]">${team.name}</div>
                <div class="text-[10px] text-sky-300">${team.edition} (${team.year}) • ${team.region}</div>
              </div>
            </div>
            <div class="space-y-1.5">
              ${team.players.map(p => renderPlayerCardDetail(p, team)).join("")}
            </div>
          </div>
        `;
      });

      body.innerHTML = html;
      modal.classList.remove("hidden");
    }

    function renderPlayerCardDetail(p, team) {
      return `
        <div class="flex items-center gap-2.5 bg-[#091533] border border-sky-400/30 rounded p-2">
          <div class="w-12 h-12 rounded overflow-hidden border border-[#f5c451]/60 shrink-0 relative">
            ${getPlayerPortraitSvg(p, team)}
            ${p.isSub ? `<span class="absolute top-0.5 right-0.5 bg-amber-400 text-slate-950 text-[7px] font-black px-1 rounded">6TH</span>` : ""}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="font-bold text-xs text-white truncate">${p.name}</span>
              <span class="text-[10px] font-extrabold text-[#fef08a]">${p.pos} • ${p.ovr} OVR</span>
            </div>
            <div class="grid grid-cols-3 gap-1 mt-1 text-[9px] text-sky-200">
              <span>MIC: <b class="text-white">${p.mic}</b></span>
              <span>MAC: <b class="text-white">${p.mac}</b></span>
              <span>SRV: <b class="text-white">${p.srv}</b></span>
              <span>DPM: <b class="text-white">${p.dpm}</b></span>
              <span>GPM: <b class="text-white">${p.gpm}</b></span>
              <span>KP: <b class="text-white">${p.kp}%</b></span>
            </div>
          </div>
        </div>
      `;
    }

    function closeRosterModal() {
      document.getElementById("rosterModal").classList.add("hidden");
    }

    // Initialize on load
    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
